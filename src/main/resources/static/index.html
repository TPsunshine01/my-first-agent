<!DOCTYPE html>
<html>
<head>
    <title>My First AI Agent</title>
    <style>
        body { font-family: Arial; max-width: 700px; margin: 50px auto; padding: 20px; background: #f5f5f5; }
        h1 { text-align: center; }
        #chat { background: white; height: 400px; overflow-y: auto; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .user { text-align: right; color: blue; margin: 10px 0; }
        .ai { text-align: left; color: black; margin: 10px 0; }
        #box { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; }
        button { padding: 12px 25px; font-size: 16px; background: #4285F4; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
<h1>🤖 My First AI Agent</h1>
<div id="chat"><div class="ai"><b>Gemini:</b> Hello! Ask me anything...</div></div>
<div id="box">
    <input id="msg" placeholder="Type your message here..." onkeydown="if(event.key==='Enter') send()" />
    <button onclick="send()">Send</button>
</div>

<script>
    async function send() {
        let input = document.getElementById("msg");
        let text = input.value.trim();
        if (!text) return;
        let chat = document.getElementById("chat");
        chat.innerHTML += `<div class="user"><b>You:</b> ${text}</div>`;
        input.value = "";
        chat.innerHTML += `<div class="ai" id="loading"><b>Gemini:</b> typing...</div>`;
        chat.scrollTop = chat.scrollHeight;

        let res = await fetch("/chat?message=" + encodeURIComponent(text));
        let reply = await res.text();
        document.getElementById("loading").remove();
        chat.innerHTML += `<div class="ai"><b>Gemini:</b> ${reply}</div>`;
        chat.scrollTop = chat.scrollHeight;
    }
</script>
</body>
</html>
